        <h3>EJEMPLO CANVAS</h3>
        <canvas id="miCanvas" width="600" height="400" style="border: 2px solid black;"> </canvas>
        <script>
    const canvas = document.getElementById("miCanvas");
    const ctx = canvas.getContext("2d");

    // Cielo
    ctx.fillStyle = "skyblue";
    ctx.fillRect(0, 0, 600, 400);

    // Sol
    ctx.beginPath();
    ctx.arc(500, 70, 45, 0, Math.PI * 2);
    ctx.fillStyle = "yellow";
    ctx.fill();

    // Suelo
    ctx.fillStyle = "green";
    ctx.fillRect(0, 300, 600, 100);

    // Casa
    ctx.fillStyle = "orange";
    ctx.fillRect(200, 190, 180, 110);

    // Techo
    ctx.beginPath();
    ctx.moveTo(180, 190);
    ctx.lineTo(290, 100);
    ctx.lineTo(400, 190);
    ctx.closePath();
    ctx.fillStyle = "brown";
    ctx.fill();

    // Puerta
    ctx.fillStyle = "darkblue";
    ctx.fillRect(270, 240, 40, 60);

    // Árbol
    ctx.fillStyle = "saddlebrown";
    ctx.fillRect(80, 220, 35, 100);

    ctx.beginPath();
    ctx.arc(95, 190, 60, 0, Math.PI * 2);
    ctx.fillStyle = "darkgreen";
    ctx.fill();

    // Ventana
    ctx.fillStyle = "lightblue";
    ctx.fillRect(220, 215, 35, 35);

    // Líneas de la ventana
    ctx.strokeStyle = "black";
    ctx.beginPath();
    ctx.moveTo(237, 215);
    ctx.lineTo(237, 250);
    ctx.moveTo(220, 232);
    ctx.lineTo(255, 232);
    ctx.stroke();
</script>
        <h3>EJEPLO DE SVG</h3>
        <svg width="500" height="300" viewBox="0 0 500 300"
        xmlns="http://www.w3.org/2000/svg">

        <!-- Cielo -->
        <rect width="500" height="300" fill="skyblue"/>

        <!-- Sol -->
        <circle cx="420" cy="60" r="40" fill="yellow"/>

        <!-- Suelo -->
        <rect x="0" y="220" width="500" height="80" fill="green"/>

        <!-- Casa -->
        <rect x="150" y="140" width="150" height="100" fill="orange"/>

        <!-- Techo -->
        <polygon points="130,140 225,70 320,140" fill="brown"/>

        <!-- Puerta -->
        <rect x="205" y="185" width="40" height="55" fill="darkblue"/>

        <!-- Ventana -->
        <rect x="170" y="160" width="35" height="30" fill="lightblue"/>
        <line x1="187" y1="160" x2="187" y2="190" stroke="black"/>
        <line x1="170" y1="175" x2="205" y2="175" stroke="black"/>

        <!-- Árbol -->
        <rect x="70" y="160" width="25" height="80" fill="saddlebrown"/>
        <circle cx="82" cy="140" r="45" fill="darkgreen"/>
        <circle cx="55" cy="155" r="30" fill="darkgreen"/>
        <circle cx="110" cy="155" r="30" fill="darkgreen"/>

    </svg>
